<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="InsurAI Claims Management - Submit new insurance claims and track your claim history.">
  <title>Claims Management - InsurAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-8">
        <a href="/index.html" class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white font-bold flex items-center justify-center">I</div>
          <span class="font-bold text-slate-900 text-lg">Insur<span class="text-indigo-600">AI</span></span>
        </a>
        <nav class="hidden md:flex gap-6 text-sm font-medium text-slate-600">
          <a href="/pages/dashboard.html" class="hover:text-slate-900 transition-colors">Dashboard</a>
          <a href="/pages/claims.html" class="text-indigo-600 font-semibold">Claims</a>
          <a href="/pages/copilot.html" class="hover:text-slate-900 transition-colors">AI Copilot</a>
        </nav>
      </div>
      <div id="nav-user-info"></div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 space-y-8">
    <div class="flex items-center justify-between">
      <h1 class="text-3xl font-extrabold text-slate-900">Submit &amp; Track Claims</h1>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- New Claim Form -->
      <div class="lg:col-span-1 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <h2 class="text-lg font-bold text-slate-900">File a New Claim</h2>
        <form id="new-claim-form" class="space-y-4">
          <div>
            <label for="claim-type" class="block text-xs font-semibold text-slate-700 mb-1">Claim Type</label>
            <select id="claim-type"
              class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="motor">Auto Collision</option>
              <option value="property">Property Damage</option>
              <option value="health">Medical Expense</option>
              <option value="other">Other (enter your own)</option>
            </select>
          </div>
          <div id="custom-claim-type-wrap" class="hidden">
            <label for="custom-claim-type" class="block text-xs font-semibold text-slate-700 mb-1">Your Claim Type</label>
            <input type="text" id="custom-claim-type" placeholder="e.g. Travel cancellation"
              class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label for="claim-description" class="block text-xs font-semibold text-slate-700 mb-1">Incident Description</label>
            <textarea id="claim-description" required rows="3" placeholder="Tell us what happened"
              class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
          </div>
          <div>
            <label for="claim-amount" class="block text-xs font-semibold text-slate-700 mb-1">Claim Amount ($)</label>
            <input type="number" id="claim-amount" required placeholder="1500"
              class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Upload Receipts / Proof</label>
            <div id="uploader-container"></div>
          </div>
          <button type="submit" id="submit-claim-btn"
            class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md transition-colors">
            Submit Claim
          </button>
        </form>
      </div>

      <!-- Claim History -->
      <div class="lg:col-span-2 space-y-4">
        <h2 class="text-lg font-bold text-slate-900">Claim History</h2>
        <div id="all-claims-list" class="space-y-3"></div>
      </div>
    </div>
  </main>

  <script src="/assets/js/state.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/nav.js"></script>
  <script src="/components/uploader.js"></script>
  <script src="/components/claims.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UploaderComponent.init('uploader-container');

      let policies = [];
      const loadClaims = async () => {
        try {
          const claims = await API.get('/claims/mine');
          Store.set('claims', claims);
          ClaimsComponent.renderList(claims, 'all-claims-list');
        } catch (_) { ClaimsComponent.renderList([], 'all-claims-list'); }
      };
      API.get('/policies/mine').then(items => { policies = items; }).catch(() => {});
      loadClaims();

      const typeSelect = document.getElementById('claim-type');
      const customWrap = document.getElementById('custom-claim-type-wrap');
      typeSelect.addEventListener('change', () => {
        const isOther = typeSelect.value === 'other';
        customWrap.classList.toggle('hidden', !isOther);
        document.getElementById('custom-claim-type').required = isOther;
      });

      document.getElementById('new-claim-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!policies.length) {
          UI.toast('No active policy is available for this account.', 'error');
          return;
        }
        const type = typeSelect.value === 'other'
          ? document.getElementById('custom-claim-type').value.trim()
          : typeSelect.value;
        try {
          await API.post('/claims', {
            policy_id: policies[0].id,
            type,
            incident_description: document.getElementById('claim-description').value.trim(),
            claimed_amount: Number(document.getElementById('claim-amount').value)
          });
          UI.toast('Claim submitted successfully.', 'success');
          e.target.reset();
          customWrap.classList.add('hidden');
          loadClaims();
        } catch (_) {}
      });
    });
  </script>
</body>
</html>
