<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="InsurAI Customer Portal - Sign in to track claims and chat with your AI copilot.">
  <title>Customer Access - InsurAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-md bg-white border border-slate-200 p-8 rounded-3xl shadow-xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white font-bold text-2xl flex items-center justify-center mx-auto shadow-lg shadow-indigo-500/30">
        C
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Customer Portal</h1>
      <p class="text-xs text-slate-500">Sign in to track claims and chat with AI copilot</p>
    </div>

    <form id="customer-login-form" class="space-y-4">
      <div>
        <label for="customer-email" class="block text-xs font-semibold text-slate-700 mb-1.5">Email Address</label>
        <input type="email" id="customer-email" required placeholder="user@example.com"
          class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label for="customer-password" class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
        <input type="password" id="customer-password" required placeholder="••••••••"
          class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <button type="submit"
        class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/20 transition-all">
        Sign In
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="/index.html" class="text-xs text-slate-400 hover:text-slate-600 transition-colors">&larr; Return Home</a>
    </div>
  </div>

  <script src="/assets/js/state.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script>
    document.getElementById('customer-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('customer-email').value;
      const pass = document.getElementById('customer-password').value;
      Auth.login(email, pass, 'customer');
    });
  </script>
</body>
</html>
